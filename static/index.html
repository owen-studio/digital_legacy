<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Legacy Project</title>

    <!-- Load styles from a separate CSS file to keep things organized -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Left-hand navigation bar -->
    <nav class="sidebar">
        <a href="/" class="nav-link">꩜ home</a>
        <a href="/today" class="nav-link">✎ today's files</a>
        <a href="/saved" class="nav-link">⟢ saved</a>
    </nav>

    <!-- Main content area, shifted right to make room for the sidebar -->
    <main class="content">
        <!-- The date header — app.js fills this in dynamically -->
        <h1 id="header"></h1>
        <h3 id="subheader"></h3>

        <!-- Container where app.js will insert each item from today's data -->
        <div id="items"></div>

        <div id="footer"></div>
    </main>

    <!-- Shared helpers (renderItem, renderFile, saveData) used across pages -->
    <script src="/static/js/helpers.js"></script>
    <!-- Load the main JavaScript file that fetches data and builds the page -->
    <script src="/static/js/app.js"></script>
</body>
</html>
